<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Approach Control — NAVDASH v4.7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #010d1e;
      --cyan:   #00e5ff;
      --green:  #00ff9f;
      --yellow: #ffcc00;
      --red:    #ff2244;
      --frame:  #00ccff;
      --glow:   0 0 6px #00e5ff, 0 0 20px rgba(0,229,255,.28);
      --mono:   'Share Tech Mono', 'Courier New', monospace;
      --vt:     'VT323', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000510;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* Scanlines */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,.16) 2px, rgba(0,0,0,.16) 4px
      );
    }

    /* CRT vignette */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.78) 100%);
    }

    /* ══ DISPLAY FRAME ══ */
    .display {
      position: relative;
      width: min(96vw, 1020px); height: min(93vh, 700px);
      background: var(--bg);
      border: 1.5px solid var(--frame);
      box-shadow: var(--glow), inset 0 0 45px rgba(0,180,255,.035);
      display: flex; flex-direction: column;
    }

    /* Corner notches */
    .notch { position: absolute; width: 24px; height: 24px; }
    .n-tl { top:-1.5px;    left:-1.5px;   border-top:   3px solid var(--frame); border-left:  3px solid var(--frame); }
    .n-tr { top:-1.5px;    right:-1.5px;  border-top:   3px solid var(--frame); border-right: 3px solid var(--frame); }
    .n-bl { bottom:-1.5px; left:-1.5px;   border-bottom:3px solid var(--frame); border-left:  3px solid var(--frame); }
    .n-br { bottom:-1.5px; right:-1.5px;  border-bottom:3px solid var(--frame); border-right: 3px solid var(--frame); }

    /* Top tab cutouts (decorative notches on top edge) */
    .tab { position: absolute; top: -1.5px; height: 5px; background: var(--frame); }
    .tab-l { left: 36px;  width: 70px; }
    .tab-r { right: 36px; width: 70px; }

    /* Bottom tab cutout */
    .tab-bot { position: absolute; bottom: -1.5px; left: 50%; transform: translateX(-50%); width: 110px; height: 4px; background: var(--frame); }

    /* ══ HEADER ══ */
    .hdr {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 20px;
      border-bottom: 1px solid rgba(0,200,255,.28);
      background: linear-gradient(90deg, rgba(0,204,255,.07) 0%, transparent 35%, transparent 65%, rgba(0,204,255,.07) 100%);
    }
    .hdr-title {
      font-family: var(--vt); font-size: 24px; letter-spacing: 3px;
      color: var(--cyan); text-shadow: var(--glow);
    }
    .hdr-sub {
      font-family: var(--mono); font-size: 10px;
      color: rgba(0,229,255,.42); letter-spacing: 1.5px; margin-top: 2px;
    }
    .hdr-right { display: flex; align-items: center; gap: 24px; }

    .legend { display: flex; gap: 16px; }
    .leg    { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; color: rgba(0,229,255,.52); letter-spacing: 1px; }
    .dot    { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot.free     { background: var(--green);  box-shadow: 0 0 5px var(--green);  }
    .dot.occupied { background: var(--yellow); box-shadow: 0 0 5px var(--yellow); }
    .dot.closed   { background: var(--red);    box-shadow: 0 0 5px var(--red); animation: blink 1.1s step-end infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.12} }

    .clk {
      font-family: var(--vt); font-size: 17px; letter-spacing: 2px;
      color: var(--cyan); text-shadow: var(--glow);
    }

    /* ══ CANVAS WRAP ══ */
    .cwrap { flex: 1 1 auto; position: relative; overflow: hidden; }
    canvas { display: block; }

    /* Animated sweep line */
    .sweep {
      position: absolute; left: 0; right: 0; height: 2px; top: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(0,229,255,.25) 50%, transparent 100%);
      animation: sweep 7s linear infinite;
      pointer-events: none; z-index: 5;
    }
    @keyframes sweep { 0% { top: 0; } 100% { top: 100%; } }

    /* ══ POPUP ══ */
    .popup {
      position: absolute; z-index: 100; pointer-events: none;
      background: rgba(1,7,20,.97);
      border: 1px solid var(--cyan);
      box-shadow: var(--glow);
      padding: 10px 15px 13px;
      min-width: 248px;
      font-family: var(--mono);
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      transform: scale(.93) translateY(6px);
    }
    .popup.show { opacity: 1; transform: scale(1) translateY(0); }

    /* Small tick connecting popup to node */
    .popup::before {
      content: ''; position: absolute; left: -5px; top: 18px;
      width: 4px; height: 4px;
      background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
    }

    .p-hdr {
      font-family: var(--vt); font-size: 19px; letter-spacing: 2px;
      color: var(--cyan); text-shadow: var(--glow);
      border-bottom: 1px solid rgba(0,229,255,.2);
      padding-bottom: 5px; margin-bottom: 8px;
    }
    .p-grid {
      display: grid; grid-template-columns: auto 1fr; gap: 3px 14px;
    }
    .p-k { font-size: 10px; color: rgba(0,229,255,.33); letter-spacing: .8px; white-space: nowrap; }
    .p-v { font-size: 10px; color: var(--cyan); letter-spacing: .5px; text-align: right; }
    .p-status {
      margin-top: 10px; padding: 4px 0;
      font-family: var(--vt); font-size: 16px; letter-spacing: 3px;
      text-align: center; border: 1px solid;
    }
    .p-status.free     { color: var(--green);  border-color: var(--green);  background: rgba(0,255,159,.06); }
    .p-status.occupied { color: var(--yellow); border-color: var(--yellow); background: rgba(255,204,0,.06); }
    .p-status.closed   { color: var(--red);    border-color: var(--red);    background: rgba(255,34,68,.06); animation: blink 1.1s step-end infinite; }

    /* ══ FOOTER ══ */
    .ftr {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 20px;
      border-top: 1px solid rgba(0,200,255,.28);
      background: linear-gradient(90deg, rgba(0,204,255,.07) 0%, transparent 35%, transparent 65%, rgba(0,204,255,.07) 100%);
      font-family: var(--mono); font-size: 10px;
      color: rgba(0,229,255,.45); letter-spacing: 1px;
    }
    .fbars { display: flex; gap: 3px; align-items: center; }
    .fbar  { width: 18px; height: 7px; background: rgba(0,200,255,.11); border: 1px solid rgba(0,200,255,.18); }
    .fbar.on { background: var(--cyan); box-shadow: 0 0 3px var(--cyan); }

    .blink-t { animation: blink 1.5s step-end infinite; }
  </style>
</head>
<body>

<div class="display">
  <!-- Frame decoration -->
  <div class="notch n-tl"></div>
  <div class="notch n-tr"></div>
  <div class="notch n-bl"></div>
  <div class="notch n-br"></div>
  <div class="tab tab-l"></div>
  <div class="tab tab-r"></div>
  <div class="tab-bot"></div>

  <!-- ── HEADER ── -->
  <header class="hdr">
    <div>
      <div class="hdr-title">PLANETARY APPROACH CONTROL <span class="blink-t">▮</span></div>
      <div class="hdr-sub">NAVDASH v4.7 &nbsp;//&nbsp; SECTOR 7-GARM &nbsp;//&nbsp; WORLD: KETHARA PRIME</div>
    </div>
    <div class="hdr-right">
      <div class="legend">
        <div class="leg"><div class="dot free"></div>FREE</div>
        <div class="leg"><div class="dot occupied"></div>OCCUPIED</div>
        <div class="leg"><div class="dot closed"></div>CLOSED</div>
      </div>
      <div class="clk" id="clk">STARDATE 2847.301</div>
    </div>
  </header>

  <!-- ── CANVAS ── -->
  <div class="cwrap" id="cwrap">
    <canvas id="nav"></canvas>
    <div class="sweep"></div>

    <!-- Vessel detail popup -->
    <div class="popup" id="popup">
      <div class="p-hdr" id="pTitle">NODE DATA</div>
      <div class="p-grid">
        <span class="p-k">VESSEL ID</span>  <span class="p-v" id="pId">—</span>
        <span class="p-k">CLASS</span>       <span class="p-v" id="pCls">—</span>
        <span class="p-k">ROUTE</span>       <span class="p-v" id="pRoute">—</span>
        <span class="p-k">ETA</span>         <span class="p-v" id="pEta">—</span>
        <span class="p-k">CARGO</span>       <span class="p-v" id="pCargo">—</span>
        <span class="p-k">DOCK BERTH</span> <span class="p-v" id="pBerth">—</span>
      </div>
      <div class="p-status" id="pStatus">—</div>
    </div>
  </div>

  <!-- ── FOOTER ── -->
  <footer class="ftr">
    <span>SYS: <span style="color:var(--green)">NOMINAL</span></span>
    <div class="fbars" id="fbars"></div>
    <span id="fStatus">SCANNING APPROACH VECTORS</span>
    <span>NODES: <span id="nCount" style="color:var(--cyan)">0</span> ACTIVE</span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('nav');
  const ctx    = canvas.getContext('2d');
  const cwrap  = document.getElementById('cwrap');
  const popup  = document.getElementById('popup');

  // Canvas fills the wrap div — keep 1:1 CSS↔canvas pixels for popup alignment
  let W, H;
  function resize() {
    W = canvas.width  = cwrap.clientWidth;
    H = canvas.height = cwrap.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // ════════════════════════════════════════════════
  //  VESSEL / ROUTE DATA
  // ════════════════════════════════════════════════
  const S = { FREE: 'free', OCC: 'occupied', CLO: 'closed' };

  const vessels = [
    { id: 'VX-7731', cls: 'FREIGHTER Mk.IV',    route: 'PROXIMA → KETHARA',       eta: '04:22:17',  cargo: 'DEUTERIUM CELLS',   berth: 'BERTH-07',      s: S.FREE },
    { id: 'CS-0084', cls: 'COURIER SLOOP',       route: 'KETHARA → OUTPOST-9',     eta: '01:55:03',  cargo: 'DIPLOMATIC PKG',    berth: 'BERTH-02',      s: S.OCC  },
    { id: 'WH-2291', cls: 'WARSHIP FRIGATE',     route: 'PATROL ARC Δ',            eta: 'IN TRANSIT', cargo: 'CLASSIFIED',       berth: 'RESTRICTED',    s: S.CLO  },
    { id: 'TG-4480', cls: 'TANKER CLASS-II',     route: 'DEEP BELT → KETHARA',     eta: '08:44:30',  cargo: 'ORE SLURRY',        berth: 'BERTH-12',      s: S.FREE },
    { id: 'PX-1193', cls: 'PASSENGER LINER',     route: 'NEXUS HUB → KETHARA',     eta: '00:30:15',  cargo: 'PASSENGERS (340)',  berth: 'BERTH-01',      s: S.OCC  },
    { id: 'SC-8872', cls: 'SCOUT RUNNER',        route: 'SURVEY LOOP Ω',           eta: 'INDEFINITE', cargo: 'SURVEY DRONES',    berth: 'NONE',          s: S.CLO  },
    { id: 'HV-5504', cls: 'HEAVY HAULER',        route: 'ASTEROID FIELD→KETHARA',  eta: '12:10:48',  cargo: 'CONSTRUCTION MAT.', berth: 'BERTH-08',      s: S.FREE },
    { id: 'MX-3360', cls: 'MEDICAL RUNNER',      route: 'KETHARA → COLONY-3',      eta: '02:17:44',  cargo: 'MEDICAL SUPPLIES',  berth: 'PRIORITY DOCK', s: S.OCC  },
  ];

  // Orbital paths: ax/ay are multiples of globe radius, rot = tilt in degrees
  // nts = parametric t positions (0–1) for nodes along that orbit
  const orbits = [
    { ax: 1.78, ay: 0.30, rot:  12, nts: [0.14, 0.67] },
    { ax: 1.55, ay: 0.25, rot: -22, nts: [0.28, 0.79] },
    { ax: 2.08, ay: 0.20, rot:   5, nts: [0.52]        },
    { ax: 1.38, ay: 0.47, rot:  58, nts: [0.08, 0.58]  },
    { ax: 1.65, ay: 0.36, rot: -48, nts: [0.38]         },
  ];

  // Status colors
  const COL = { free: '#00ff9f', occupied: '#ffcc00', closed: '#ff2244' };

  // ════════════════════════════════════════════════
  //  GLOBE STATE
  // ════════════════════════════════════════════════
  let globeRot = 0;  // longitude rotation for slow spin

  function getGlobe() {
    return {
      cx: W * 0.5,
      cy: H * 0.5,
      r:  Math.min(W, H) * 0.225,
    };
  }

  // ════════════════════════════════════════════════
  //  NODE POSITIONS
  // ════════════════════════════════════════════════
  function orbitPt(cx, cy, r, orb, t) {
    const ax  = r * orb.ax;
    const ay  = r * orb.ay;
    const rot = orb.rot * Math.PI / 180;
    const a   = t * Math.PI * 2;
    const lx  = ax * Math.cos(a);
    const ly  = ay * Math.sin(a);
    return {
      x: cx + lx * Math.cos(rot) - ly * Math.sin(rot),
      y: cy + lx * Math.sin(rot) + ly * Math.cos(rot),
    };
  }

  let nodes = [];

  function buildNodes() {
    const { cx, cy, r } = getGlobe();
    nodes = [];
    let vi = 0;
    orbits.forEach(orb => {
      orb.nts.forEach(t => {
        if (vi >= vessels.length) return;
        const { x, y } = orbitPt(cx, cy, r, orb, t);
        nodes.push({ x, y, v: vessels[vi++] });
      });
    });
    document.getElementById('nCount').textContent = nodes.length;
  }

  // ════════════════════════════════════════════════
  //  DRAW: BACKGROUND GRID
  // ════════════════════════════════════════════════
  function drawGrid() {
    ctx.strokeStyle = 'rgba(0,140,200,.1)';
    ctx.lineWidth = 1;
    const sp = 40;
    for (let x = 0; x < W; x += sp) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += sp) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // Axis tick labels
    ctx.fillStyle = 'rgba(0,200,255,.17)';
    ctx.font = '8px "Share Tech Mono", monospace';
    for (let x = sp; x < W; x += sp * 2) ctx.fillText(String(x / sp).padStart(2, '0'), x - 4, 10);
    for (let y = sp; y < H; y += sp * 2) ctx.fillText(String(y / sp).padStart(2, '0'), 3,     y + 4);
  }

  // ════════════════════════════════════════════════
  //  DRAW: WIREFRAME GLOBE
  // ════════════════════════════════════════════════
  function drawGlobe() {
    const { cx, cy, r } = getGlobe();
    const LAT = 10, LON = 16;

    // Latitude rings (ellipses projected with ~15° tilt)
    ctx.lineWidth = 0.75;
    for (let i = 0; i <= LAT; i++) {
      const phi  = -Math.PI / 2 + Math.PI * i / LAT;
      const cosP = Math.cos(phi), sinP = Math.sin(phi);
      const ry   = r * cosP;
      const py   = cy + r * sinP * 0.96;   // slight perspective correction
      if (ry < 0.5) continue;
      const alpha = (0.14 + 0.52 * cosP * cosP).toFixed(2);
      ctx.strokeStyle = `rgba(185,255,242,${alpha})`;
      ctx.beginPath();
      ctx.ellipse(cx, py, ry, ry * 0.27, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Longitude arcs — rotate with globeRot for slow spin effect
    ctx.lineWidth = 0.65;
    for (let i = 0; i < LON; i++) {
      const lon  = globeRot + (Math.PI * 2 * i) / LON;
      const cosL = Math.cos(lon), sinL = Math.sin(lon);
      const face = Math.max(0, cosL);                  // front-face brightness
      const alpha = (0.1 + 0.48 * face).toFixed(2);
      ctx.strokeStyle = `rgba(185,255,242,${alpha})`;
      ctx.beginPath();
      let first = true;
      for (let j = 0; j <= 52; j++) {
        const phi  = -Math.PI / 2 + Math.PI * j / 52;
        const cosP = Math.cos(phi), sinP = Math.sin(phi);
        // Orthographic projection with subtle Z-axis tilt
        const px = cx + r * cosP * cosL;
        const py = cy + r * sinP - r * cosP * sinL * 0.16;
        first ? (ctx.moveTo(px, py), first = false) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // Atmosphere glow
    const grd = ctx.createRadialGradient(cx, cy, r * 0.78, cx, cy, r * 1.35);
    grd.addColorStop(0, 'rgba(0,160,255,.055)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.35, 0, Math.PI * 2); ctx.fill();
  }

  // ════════════════════════════════════════════════
  //  DRAW: ORBITAL FLIGHT PATHS
  // ════════════════════════════════════════════════
  function drawOrbits() {
    const { cx, cy, r } = getGlobe();
    orbits.forEach(orb => {
      const ax  = r * orb.ax;
      const ay  = r * orb.ay;
      const rot = orb.rot * Math.PI / 180;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);

      // Glow halo
      ctx.strokeStyle = 'rgba(0,255,102,.1)';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(0, 0, ax, ay, 0, 0, Math.PI * 2); ctx.stroke();

      // Dashed path line
      ctx.strokeStyle = '#00dd55';
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 5]);
      ctx.beginPath(); ctx.ellipse(0, 0, ax, ay, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    });
  }

  // ════════════════════════════════════════════════
  //  DRAW: NODES (diamonds with status colour + pulse)
  // ════════════════════════════════════════════════
  function drawNodes(frameN, activeIdx, flashNow) {
    nodes.forEach((nd, i) => {
      const col = COL[nd.v.s];
      const sz  = 7;

      // Outer pulse ring
      const phase = 0.45 + 0.45 * Math.sin(frameN * 0.0026 + nd.x * 0.04);
      ctx.strokeStyle = col;
      ctx.globalAlpha = phase * 0.28;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, sz * 2.3, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;

      // Click flash ripple (brief expanding ring on arrival)
      if (i === activeIdx && flashNow > 0) {
        const fp  = Math.max(0, 1 - flashNow);
        const rad = sz * 2 + fp * sz * 5;
        ctx.strokeStyle = `rgba(255,255,255,${(1 - fp) * 0.7})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(nd.x, nd.y, rad, 0, Math.PI * 2); ctx.stroke();
      }

      // Diamond glow
      ctx.shadowColor = col;
      ctx.shadowBlur  = 18;
      ctx.fillStyle   = col;
      ctx.beginPath();
      ctx.moveTo(nd.x,      nd.y - sz);
      ctx.lineTo(nd.x + sz, nd.y     );
      ctx.lineTo(nd.x,      nd.y + sz);
      ctx.lineTo(nd.x - sz, nd.y     );
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // ID label
      ctx.fillStyle = col;
      ctx.font = '10px "Share Tech Mono", monospace';
      ctx.fillText(nd.v.id, nd.x + sz + 5, nd.y + 4);
    });
  }

  // ════════════════════════════════════════════════
  //  DRAW: FAINT PLANET-CENTRE AXES
  // ════════════════════════════════════════════════
  function drawAxes() {
    const { cx, cy } = getGlobe();
    ctx.strokeStyle = 'rgba(0,200,255,.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 11]);
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ════════════════════════════════════════════════
  //  DRAW: SIDE INFO PANELS (on canvas)
  // ════════════════════════════════════════════════
  function drawPanels() {
    // ── LEFT: Planet facts ──
    const lx = 14, ly = 12, pw = 148, ph = 168;
    ctx.fillStyle   = 'rgba(0,160,255,.04)';
    ctx.fillRect(lx, ly, pw, ph);
    ctx.strokeStyle = 'rgba(0,200,255,.2)';
    ctx.lineWidth   = 1;
    ctx.strokeRect(lx, ly, pw, ph);
    // bracket corners
    drawBracket(lx, ly, 8);
    drawBracket(lx + pw, ly, 8, true, false);
    drawBracket(lx, ly + ph, 8, false, true);
    drawBracket(lx + pw, ly + ph, 8, true, true);

    ctx.fillStyle = '#00e5ff';
    ctx.font = '14px "VT323", monospace';
    ctx.fillText('KETHARA PRIME', lx + 8, ly + 16);

    const leftData = [
      ['TYPE',    'CLASS-M WORLD'],
      ['MASS',    '1.24 T⊕'],
      ['RADIUS',  '7,240 KM'],
      ['ATMO',    'N₂/O₂/CO₂'],
      ['TEMP',    '288–310 K'],
      ['ROUTES',  nodes.length + ' ACTIVE'],
      ['TRAFFIC', 'MODERATE'],
    ];
    leftData.forEach(([k, v], i) => {
      const y2 = ly + 32 + i * 19;
      ctx.font = '9px "Share Tech Mono", monospace';
      ctx.fillStyle = 'rgba(0,180,255,.3)';  ctx.fillText(k, lx + 8,  y2);
      ctx.fillStyle = 'rgba(0,229,255,.72)'; ctx.fillText(v, lx + 54, y2);
    });

    // ── RIGHT: Approach status ──
    const rpw = 150, rph = 152, rx = W - rpw - 14, ry = 12;
    ctx.fillStyle   = 'rgba(0,160,255,.04)';
    ctx.fillRect(rx, ry, rpw, rph);
    ctx.strokeStyle = 'rgba(0,200,255,.2)';
    ctx.lineWidth   = 1;
    ctx.strokeRect(rx, ry, rpw, rph);
    drawBracket(rx, ry, 8);
    drawBracket(rx + rpw, ry, 8, true, false);
    drawBracket(rx, ry + rph, 8, false, true);
    drawBracket(rx + rpw, ry + rph, 8, true, true);

    ctx.fillStyle = '#00e5ff';
    ctx.font = '14px "VT323", monospace';
    ctx.fillText('APPROACH STATUS', rx + 8, ry + 16);

    const cnt = { free: 0, occupied: 0, closed: 0 };
    nodes.forEach(n => cnt[n.v.s]++);

    [['FREE', cnt.free, COL.free], ['OCCUPIED', cnt.occupied, COL.occupied], ['CLOSED', cnt.closed, COL.closed]]
      .forEach(([lbl, c, col], i) => {
        const by  = ry + 34 + i * 36;
        const bw  = rpw - 20;
        ctx.font = '9px "Share Tech Mono", monospace';
        ctx.fillStyle = 'rgba(0,180,255,.3)'; ctx.fillText(lbl, rx + 8, by);
        ctx.fillStyle = col;                  ctx.fillText(String(c), rx + rpw - 14, by);
        // bar background
        ctx.fillStyle = 'rgba(0,200,255,.1)';
        ctx.fillRect(rx + 8, by + 5, bw, 7);
        // bar fill
        ctx.fillStyle   = col;
        ctx.shadowColor = col; ctx.shadowBlur = 5;
        ctx.fillRect(rx + 8, by + 5, bw * (c / Math.max(nodes.length, 1)), 7);
        ctx.shadowBlur  = 0;
      });
  }

  // Small L-bracket at panel corner
  function drawBracket(x, y, len, flipX = false, flipY = false) {
    const dx = flipX ? -1 : 1;
    const dy = flipY ? -1 : 1;
    ctx.strokeStyle = 'rgba(0,200,255,.45)';
    ctx.lineWidth   = 1.2;
    ctx.beginPath();
    ctx.moveTo(x + dx * len, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + dy * len);
    ctx.stroke();
  }

  // ════════════════════════════════════════════════
  //  DRAW: CROSSHAIR CURSOR (full-span lines)
  // ════════════════════════════════════════════════
  function drawCrosshair(x, y) {
    ctx.save();

    // Full-width horizontal + full-height vertical — dashed, dim
    ctx.strokeStyle = 'rgba(0,229,255,.35)';
    ctx.lineWidth   = 1;
    ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    ctx.setLineDash([]);

    // Solid short arms near the cursor centre
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth   = 1.3;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur  = 8;
    const gap = 10, arm = 22;
    ctx.beginPath();
    ctx.moveTo(x - gap - arm, y); ctx.lineTo(x - gap, y);
    ctx.moveTo(x + gap,       y); ctx.lineTo(x + gap + arm, y);
    ctx.moveTo(x, y - gap - arm); ctx.lineTo(x, y - gap);
    ctx.moveTo(x, y + gap);       ctx.lineTo(x, y + gap + arm);
    ctx.stroke();

    // Centre box
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 4, y - 4, 8, 8);
    ctx.shadowBlur = 0;

    // Edge coordinate readouts
    ctx.fillStyle = 'rgba(0,229,255,.52)';
    ctx.font = '9px "Share Tech Mono", monospace';
    ctx.fillText('X:' + String(Math.round(x)).padStart(4, '0'), x + 8,  H - 8);
    ctx.fillText('Y:' + String(Math.round(y)).padStart(4, '0'), W - 62, y - 5);

    ctx.restore();
  }

  // ════════════════════════════════════════════════
  //  POPUP: open / close
  // ════════════════════════════════════════════════
  function openPopup(nd) {
    const v = nd.v;
    document.getElementById('pTitle').textContent  = v.id + ' // NODE DATA';
    document.getElementById('pId').textContent     = v.id;
    document.getElementById('pCls').textContent    = v.cls;
    document.getElementById('pRoute').textContent  = v.route;
    document.getElementById('pEta').textContent    = v.eta;
    document.getElementById('pCargo').textContent  = v.cargo;
    document.getElementById('pBerth').textContent  = v.berth;
    const ps = document.getElementById('pStatus');
    ps.textContent = v.s.toUpperCase();
    ps.className   = 'p-status ' + v.s;

    // Position near node, clamp to canvas bounds
    let px = nd.x + 18, py = nd.y - 12;
    if (px + 262 > W) px = nd.x - 278;
    if (py + 210 > H) py = nd.y - 200;
    if (py < 0)       py = nd.y + 18;
    if (px < 0)       px = nd.x + 18;

    popup.style.left = px + 'px';
    popup.style.top  = py + 'px';
    popup.classList.add('show');
    document.getElementById('fStatus').textContent = 'SCANNING: ' + v.id + ' // ' + v.s.toUpperCase();
  }

  function closePopup() {
    popup.classList.remove('show');
    document.getElementById('fStatus').textContent = 'SCANNING APPROACH VECTORS';
  }

  // ════════════════════════════════════════════════
  //  FOOTER ACTIVITY BARS
  // ════════════════════════════════════════════════
  const fbarsEl = document.getElementById('fbars');
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'fbar' + (i < 8 ? ' on' : '');
    fbarsEl.appendChild(d);
  }
  let fbT = 0;
  function tickFbars() {
    fbT++;
    const lit = 5 + Math.round(4 * Math.abs(Math.sin(fbT * 0.09)));
    fbarsEl.querySelectorAll('.fbar').forEach((b, i) => b.classList.toggle('on', i < lit));
  }

  // ════════════════════════════════════════════════
  //  STARDATE CLOCK
  // ════════════════════════════════════════════════
  let sd = 2847.301;
  setInterval(() => {
    sd += 0.001;
    document.getElementById('clk').textContent = 'STARDATE ' + sd.toFixed(3);
  }, 1000);

  // ════════════════════════════════════════════════
  //  CROSSHAIR ANIMATION STATE MACHINE
  // ════════════════════════════════════════════════
  let curX = 0, curY = 0;        // current crosshair position
  let srcX = 0, srcY = 0;        // movement start
  let tgtX = 0, tgtY = 0;        // movement target

  let nodeIdx   = 0;
  let flashProgress = -1;        // -1 = none, 0..1 = animating

  const PH  = { INIT:0, MOVE:1, PAUSE:2, POPUP:3, DISMISS:4 };
  let phase = PH.INIT;
  let phaseStart = 0;

  const DUR = {
    init:    900,   // ms before first move
    move:   1700,   // ms to travel between nodes
    pause:   450,   // ms pause after arriving (before popup)
    popup:  3800,   // ms popup stays visible
    dismiss: 650,   // ms after closing popup
  };

  function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

  // ════════════════════════════════════════════════
  //  MAIN ANIMATION LOOP
  // ════════════════════════════════════════════════
  let frameN    = 0;
  let firstLoop = true;

  function loop(now) {
    if (firstLoop) {
      phaseStart = now;
      curX = srcX = tgtX = W * 0.5;
      curY = srcY = tgtY = H * 0.5;
      firstLoop = false;
    }

    frameN++;
    globeRot += 0.0018;   // slow planetary rotation

    // ── rebuild node positions each frame (trivially cheap, stays accurate on resize)
    buildNodes();

    // ── draw ──
    ctx.fillStyle = '#010d1e';
    ctx.fillRect(0, 0, W, H);

    drawGrid();
    drawAxes();
    drawOrbits();
    drawGlobe();
    drawNodes(frameN, nodeIdx, flashProgress);
    drawPanels();
    drawCrosshair(curX, curY);

    // ── advance flash ──
    if (flashProgress >= 0) {
      flashProgress = Math.min(flashProgress + 0.06, 1);
      if (flashProgress >= 1) flashProgress = -1;
    }

    // ── phase state machine ──
    if (nodes.length === 0) { requestAnimationFrame(loop); return; }

    const el = now - phaseStart;

    switch (phase) {
      case PH.INIT:
        if (el > DUR.init) {
          srcX = curX; srcY = curY;
          tgtX = nodes[nodeIdx].x; tgtY = nodes[nodeIdx].y;
          phase = PH.MOVE; phaseStart = now;
        }
        break;

      case PH.MOVE: {
        const p = Math.min(el / DUR.move, 1);
        const e = easeInOut(p);
        curX = srcX + (tgtX - srcX) * e;
        curY = srcY + (tgtY - srcY) * e;
        if (p >= 1) { phase = PH.PAUSE; phaseStart = now; }
        break;
      }

      case PH.PAUSE:
        if (el > DUR.pause) {
          flashProgress = 0;
          openPopup(nodes[nodeIdx]);
          phase = PH.POPUP; phaseStart = now;
        }
        break;

      case PH.POPUP:
        if (el > DUR.popup) {
          closePopup();
          phase = PH.DISMISS; phaseStart = now;
        }
        break;

      case PH.DISMISS:
        if (el > DUR.dismiss) {
          nodeIdx = (nodeIdx + 1) % nodes.length;
          srcX = curX; srcY = curY;
          tgtX = nodes[nodeIdx].x; tgtY = nodes[nodeIdx].y;
          phase = PH.MOVE; phaseStart = now;
        }
        break;
    }

    tickFbars();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
