name: CSS Compliance Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.css'
  push:
    branches:
      - main
    paths:
      - '**/*.css'
  schedule:
    - cron: '0 12 * * 3'

jobs:
  css-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    name: Verify World Anvil CSS Compliance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug diff context
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "PR base SHA: ${{ github.event.pull_request.base.sha }}"
          echo "PR head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Push before SHA: ${{ github.event.before }}"
          git --version
          git rev-parse --is-shallow-repository

      - name: Run CSS Compliance Check
        run: node .github/scripts/check-css-compliance.js
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          CSS_COMPLIANCE_SCAN_MODE: ${{ github.event_name == 'schedule' && 'all' || 'changed' }}
        continue-on-error: false

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.github/css-compliance-report.md';
            let reportBody = '\n\nSee workflow logs for details.';
            const marker = 'CSS Compliance Check Failed';

            if (fs.existsSync(reportPath)) {
              reportBody = `\n\n${fs.readFileSync(reportPath, 'utf8')}`;
            }

            const body = '❌ **CSS Compliance Check Failed**\n\nThis PR contains CSS that may violate World Anvil Terms of Service. Please review the [CSS Limits and Rules](https://github.com/${{ github.repository }}/blob/main/World%20Anvil%20Structure/CSS_Limits_and_Rules.md) documentation.\n\nCommon violations:\n- Targeting non `.user-css` selectors\n- Hiding required UI elements\n- Attempting to modify prohibited elements' + reportBody;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user && c.user.login === 'github-actions[bot]' &&
              typeof c.body === 'string' &&
              c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Prepare weekly report file
        if: failure() && github.event_name == 'schedule'
        run: |
          mkdir -p .github/compliance
          {
            echo "# Weekly CSS Compliance Violations"
            echo
            echo "- Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "- Repository: ${{ github.repository }}"
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f .github/css-compliance-report.md ]; then
              cat .github/css-compliance-report.md
            else
              echo "No report file was generated by the compliance script."
            fi
          } > .github/compliance/weekly-css-compliance-report.md

      - name: Reopen remediation PR when violations return
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const head = `${context.repo.owner}:bot/css-compliance-weekly`;
            const base = 'main';

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              head,
              base,
              sort: 'updated',
              direction: 'desc',
              per_page: 50,
            });

            if (pulls.length === 0) {
              core.info('No closed remediation PR found to reopen.');
              return;
            }

            const pr = pulls.find(p => !p.merged_at);

            if (!pr) {
              core.info('Only merged remediation PRs were found; nothing to reopen.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'open',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '❌ Weekly CSS compliance scan detected violations again. Reopening this automated remediation PR and updating the report.'
            });

      - name: Create or update remediation PR
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update weekly CSS compliance violations report"
          branch: bot/css-compliance-weekly
          delete-branch: false
          title: "chore: weekly CSS compliance violations detected"
          body: |
            This automated PR was opened because the weekly CSS compliance scan detected violations.

            What this PR contains:
            - Updated report at `.github/compliance/weekly-css-compliance-report.md`
            - Offending files and line numbers from the latest scan

            Next steps:
            - Fix the listed CSS violations
            - Keep this PR open as a tracking item until all violations are resolved

            Source run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            automated
            css-compliance
          add-paths: |
            .github/compliance/weekly-css-compliance-report.md

      - name: Close remediation PR when clean
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const head = `${context.repo.owner}:bot/css-compliance-weekly`;
            const base = 'main';

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              base,
              per_page: 50,
            });

            if (pulls.length === 0) {
              core.info('No open remediation PR to close.');
              return;
            }

            for (const pr of pulls) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '✅ Weekly CSS compliance scan passed with no violations. Closing this automated remediation PR.'
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });
            }
