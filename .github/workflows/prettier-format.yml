name: Prettier Code Format

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    name: Format Code with Prettier

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Prettier
        run: npm install --save-dev prettier

      - name: Check code formatting
        id: prettier
        run: npx prettier --check . --ignore-unknown
        continue-on-error: true

      - name: Auto-format and commit (on branch push)
        if: github.event_name == 'push' && steps.prettier.outcome == 'failure'
        run: |
          npx prettier --write . --ignore-unknown
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format code with Prettier"
          git push
        continue-on-error: false

      - name: Run CSS Compliance Check on PR (Priority Check)
        id: compliance
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-css-compliance.js
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          CSS_COMPLIANCE_SCAN_MODE: changed
        continue-on-error: true

      - name: Comment on PR with compliance issues (takes priority over formatting)
        if: github.event_name == 'pull_request' && steps.compliance.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.github/css-compliance-report.md';
            let reportBody = '\n\nSee workflow logs for details.';

            if (fs.existsSync(reportPath)) {
              reportBody = `\n\n${fs.readFileSync(reportPath, 'utf8')}`;
            }

            const body = '⚠️ **World Anvil Compliance Check Failed**\n\n**Compliance rules take priority over code formatting.** This PR contains CSS that violates World Anvil Terms of Service.\n\nPlease review the [CSS Limits and Rules](https://github.com/${{ github.repository }}/blob/main/World%20Anvil%20Structure/CSS_Limits_and_Rules.md) documentation and fix the violations before pushing again.' + reportBody;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body.includes('World Anvil Compliance Check Failed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Comment on PR with formatting instructions (only if compliance passes)
        if: github.event_name == 'pull_request' && steps.prettier.outcome == 'failure' && steps.compliance.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `❌ **Code Formatting Issues Found**\n\nThis PR contains code that doesn't match the project's formatting standards (Prettier).\n\n### To fix locally:\n\`\`\`bash\nnpm install --save-dev prettier\nnpx prettier --write .\ngit add -A\ngit commit -m "chore: format code with Prettier"\ngit push\n\`\`\`\n\nAlternatively, formatting will be automatically applied if you push changes to this branch.`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body.includes('Code Formatting Issues Found')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail PR if compliance check failed (Priority)
        if: github.event_name == 'pull_request' && steps.compliance.outcome == 'failure'
        run: |
          echo "❌ World Anvil compliance violation detected. Compliance rules take priority."
          exit 1

      - name: Fail PR if formatting issues exist (Secondary)
        if: github.event_name == 'pull_request' && steps.prettier.outcome == 'failure' && steps.compliance.outcome != 'failure'
        run: |
          echo "❌ Code formatting issues detected. See PR comment for instructions."
          exit 1

      - name: All checks passed
        if: github.event_name == 'pull_request' && steps.prettier.outcome == 'success' && steps.compliance.outcome == 'success'
        run: echo "✅ Code formatting and World Anvil compliance checks passed!"
